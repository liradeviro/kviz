<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9b6ec">
<title>Квиз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4b3f72;
  --ink-soft:#7a6ea3;
  --lav:#9d86e0;
  --lav-deep:#7b62d1;
  --pink:#f3a8d6;
  --glass:rgba(255,255,255,.38);
  --glass-brd:rgba(255,255,255,.85);
  --sea-ink:#1f4f86;
  --sign:#1f5a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:#e6d9f5;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ===================== КАРТА ===================== */
#map{position:relative;min-height:100vh}
.sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 18% at 20% 12%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(50% 15% at 80% 30%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(70% 20% at 30% 55%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(55% 16% at 75% 78%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(40% 12% at 15% 90%,rgba(255,255,255,.5),transparent 70%),
    linear-gradient(170deg,#b7a3ea 0%,#d9c4f0 30%,#f2dcef 55%,#d6c1f1 80%,#a995e4 100%);
}
.sky::after{ /* дымка облаков */
  content:"";position:absolute;inset:-10%;
  background:
    radial-gradient(35% 10% at 60% 20%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(40% 9% at 25% 40%,rgba(255,255,255,.45),transparent 70%),
    radial-gradient(45% 10% at 70% 65%,rgba(255,255,255,.45),transparent 70%);
  filter:blur(8px);animation:drift 40s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translateX(6%)}}
#doodles{position:fixed;inset:0;z-index:1;pointer-events:none}
#doodles svg{position:absolute;overflow:visible}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(rgba(201,182,236,.85),rgba(201,182,236,0));
}
.brand{font-family:Comfortaa;font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 6px rgba(90,60,160,.45)}
.brand small{display:block;font-family:Nunito;font-weight:600;font-size:12px;opacity:.95}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1.5px solid var(--glass-brd);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;cursor:pointer;color:#fff;
}
.icon-btn svg{width:20px;height:20px}

#track{position:relative;z-index:2;max-width:480px;margin:0 auto}
#pathSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stop{
  position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
  border:2px solid var(--glass-brd);background:var(--glass);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(110,80,190,.25), inset 0 0 12px rgba(255,255,255,.5);
  transition:transform .2s;
}
.stop:active{transform:scale(.93)}
.stop svg{width:24px;height:24px;color:#fff}
.stop.time-locked{opacity:.75}
.stop.time-locked svg{color:rgba(255,255,255,.9)}
.stop.open{
  background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(214,196,255,.7));
  animation:pulse 2.2s ease-in-out infinite;
}
.stop.open svg{color:var(--lav-deep)}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.8),0 6px 18px rgba(110,80,190,.3)}
  50%{box-shadow:0 0 0 12px rgba(255,255,255,0),0 6px 18px rgba(110,80,190,.3)}
}
.stop.solved{
  background:linear-gradient(145deg,#b39cf0,#f0a9d8);border-color:#fff;
}
.stop .letter{display:block;line-height:1;font-family:Comfortaa;font-weight:700;font-size:30px;color:#fff;text-shadow:0 2px 6px rgba(90,50,150,.35)}
.stop .num{
  position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
  background:#fff;color:var(--lav-deep);font-size:12px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(110,80,190,.25);
}
.stop.final{width:84px;height:84px;margin:-42px 0 0 -42px;background:linear-gradient(145deg,#fff,#e4d6ff)}
.stop.final svg{width:34px;height:34px;color:var(--lav-deep)}
.stop.final.solved{background:linear-gradient(145deg,#9c84ec,#f3a8d6)}
.stop.final.solved svg{color:#fff}
.stop-date{
  position:absolute;transform:translate(-50%,0);margin-top:38px;white-space:nowrap;
  font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(90,60,160,.55);pointer-events:none;
}
.timer{
  position:absolute;transform:translate(-50%,0);margin-top:40px;white-space:nowrap;z-index:3;
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.88);color:var(--lav-deep);font-weight:800;font-size:13px;
  box-shadow:0 4px 14px rgba(110,80,190,.3);border:none;
}
.timer svg{width:15px;height:15px}

/* ===================== ОСТАНОВКА ===================== */
#day{position:relative;min-height:100vh}
.beach{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#5c9de6 0%,#8fc0f0 42%,#b9dbf7 62%,#c9e4fa 66%);
}
.beach .cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(10px);opacity:.7}
.beach .sea{position:absolute;left:0;right:0;top:66%;height:14%;
  background:linear-gradient(180deg,#1d73c7 0%,#2f9ad8 60%,#58c2e3 100%)}
.beach .sea::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:8px;
  background:radial-gradient(12px 5px at 12px 4px,#fff 60%,transparent 62%) repeat-x;background-size:26px 8px;opacity:.85}
.beach .sand{position:absolute;left:0;right:0;top:80%;bottom:0;
  background:linear-gradient(180deg,#f6e9df,#f0dccd)}
#day.final-mode .beach{background:linear-gradient(180deg,#a48fe4 0%,#cdb7f0 40%,#f1d8ef 62%,#f6e2f0 66%)}
#day.final-mode .beach .sea{background:linear-gradient(180deg,#7a6bd6,#a68ee6 60%,#c7b0f0)}

.day-wrap{position:relative;z-index:2;max-width:460px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.3);color:#fff;font-weight:800;font-size:14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.back svg{width:18px;height:18px}

/* табличка */
.sign{position:relative;width:190px;margin:10px auto 0;text-align:center}
.sign-plate{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(20,60,110,.3);border:3px solid #d9e2e8}
.sign-head{background:var(--sign);color:#fff;font-family:Comfortaa;font-weight:700;font-size:12px;letter-spacing:.25em;padding:6px 0 5px}
.sign-body{font-family:Comfortaa;font-weight:700;font-size:30px;color:#173f35;padding:6px 0 8px}
.sign-pole{width:10px;height:22px;margin:0 auto;background:linear-gradient(90deg,#8a4b2a,#c0754a,#8a4b2a)}

/* павильон */
.shelter{position:relative;margin-top:-2px}
.roof{height:16px;margin:0 -10px;border-radius:3px;
  background:linear-gradient(180deg,#f4f7f9,#b9c4cc 55%,#8f9ba4);box-shadow:0 4px 10px rgba(20,50,90,.35)}
.frame{position:relative;margin:0 4px;border:6px solid #c5ced5;border-top:none;border-bottom:none;
  background:linear-gradient(180deg,rgba(40,110,210,.35),rgba(30,90,190,.28));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);padding:16px 14px 20px}
.frame::before{ /* стойки между стёклами */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(33.3% - 3px),rgba(197,206,213,.55) calc(33.3% - 3px),rgba(197,206,213,.55) calc(33.3% + 3px),transparent calc(33.3% + 3px),transparent calc(66.6% - 3px),rgba(197,206,213,.55) calc(66.6% - 3px),rgba(197,206,213,.55) calc(66.6% + 3px),transparent calc(66.6% + 3px));
}
.frame>*{position:relative}
.copper{position:relative;margin:0 4px;height:58px;border:6px solid #c5ced5;border-top:none;
  background:linear-gradient(100deg,#9c4e2a,#c46a3c 30%,#a9552f 60%,#c77143)}
.bench{position:absolute;left:8%;right:8%;top:20px;height:9px;border-radius:2px;background:linear-gradient(#d07a48,#8e4523);box-shadow:0 3px 4px rgba(0,0,0,.25)}
.floor{height:10px;margin:0 -6px;background:linear-gradient(#dfe5ea,#aab4bc);border-radius:2px}

.card{background:rgba(255,255,255,.82);border-radius:16px;padding:14px 16px;margin-bottom:12px;color:#25406a;
  box-shadow:0 4px 14px rgba(15,50,110,.18)}
.card h3{margin:0 0 6px;font-family:Comfortaa;font-weight:700;font-size:14px;color:#2d6fc0;letter-spacing:.02em}
.card p{margin:0;font-size:16px;line-height:1.45;white-space:pre-line}
.hint2-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
  background:rgba(255,255,255,.35);border:1.5px dashed rgba(255,255,255,.9);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;
  font-weight:800;font-size:15px;text-align:left}
.hint2-btn span{font-weight:600;font-size:13px;opacity:.9}
.answer-row{display:flex;gap:8px}
.answer-row input{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.92);font-size:16px;font-weight:600;color:#25406a;outline:none}
.answer-row input:focus{border-color:#ffd6f0;box-shadow:0 0 0 3px rgba(243,168,214,.45)}
.btn{padding:13px 18px;border-radius:14px;border:none;cursor:pointer;font-weight:800;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--lav),#e58fcb);box-shadow:0 4px 12px rgba(120,80,190,.35)}
.btn:active{transform:translateY(1px)}
.wrong{min-height:24px;margin-top:8px;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(20,50,110,.5)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.solved-box{text-align:center;padding:48px 6px 40px;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.solved-box .lbl{font-weight:700;color:#fff;font-size:14px;opacity:.95;text-shadow:0 1px 4px rgba(20,50,110,.5)}
.big-word{font-family:Comfortaa;font-weight:700;font-size:44px;color:#fff;margin:12px 0 6px;
  text-shadow:0 3px 10px rgba(20,50,110,.45);line-height:1.35}
.big-word .w{display:inline-block;white-space:nowrap;letter-spacing:.05em;vertical-align:middle}
.big-word .w + .w{margin-left:.3em}
.big-word .first{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  width:1.45em;height:1.45em;margin:0 .12em 0 0;border-radius:50%;font-size:1.15em;line-height:1;letter-spacing:0;
  background:linear-gradient(145deg,#b39cf0,#f3a8d6);box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 24px rgba(243,168,214,.9);
  text-shadow:none;animation:glow 2.4s ease-in-out infinite}
.big-word .first i{font-style:normal;display:block;line-height:1}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 38px rgba(243,168,214,1)}}

.tiny{position:absolute;z-index:3;font-size:10px;font-weight:600;letter-spacing:.04em;pointer-events:none;user-select:none;opacity:.42}

/* финал */
.rule{animation:pop .6s ease-out;border:2px solid #fff;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(240,228,255,.95))}
.rule h3{color:var(--lav-deep);font-size:16px}

/* модалки */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(70,50,120,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:360px;background:linear-gradient(160deg,#fff,#f3ebff);border-radius:22px;padding:22px 18px 18px;
  box-shadow:0 20px 50px rgba(70,40,140,.35);animation:pop .25s ease-out}
.modal h2{margin:0 0 6px;font-family:Comfortaa;font-size:19px;color:var(--lav-deep);text-align:center}
.modal p{margin:0 0 14px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.4}
.modal .answer-row input{border-color:#e2d8f7}
.modal .err{min-height:20px;margin-top:8px;text-align:center;color:#d0508f;font-weight:800;font-size:14px}
.modal .close{display:block;margin:6px auto 0;background:none;border:none;color:var(--ink-soft);font-weight:700;cursor:pointer;padding:8px}
.code-box{font-family:Comfortaa;font-weight:700;font-size:22px;letter-spacing:.08em;text-align:center;padding:12px;border-radius:14px;
  background:#efe6ff;color:var(--lav-deep);margin-bottom:10px;user-select:all;word-break:break-all}
.sep{height:1px;background:#e5dcf6;margin:16px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:rgba(75,63,114,.92);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;
  white-space:nowrap;animation:fade .2s}
</style>
</head>
<body>

<!-- ===================== КАРТА ===================== -->
<section id="map">
  <div class="sky"></div>
  <div id="doodles"></div>
  <header class="topbar">
    <div class="brand">Квиз<small id="progressLbl"></small></div>
    <button class="icon-btn" id="menuBtn" aria-label="Код прогресса">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>
    </button>
  </header>
  <div id="track"><svg id="pathSvg"></svg></div>
</section>

<!-- ===================== ОСТАНОВКА ===================== -->
<section id="day" class="hidden">
  <div class="beach">
    <div class="cloud" style="width:140px;height:40px;left:8%;top:12%"></div>
    <div class="cloud" style="width:90px;height:26px;left:62%;top:7%"></div>
    <div class="cloud" style="width:170px;height:44px;left:55%;top:30%;opacity:.45"></div>
    <div class="sea"></div>
    <div class="sand"></div>
  </div>
  <div class="day-wrap" id="dayWrap"></div>
</section>

const DAY_MS = 864e5;
const START_UTC = Date.UTC(START_MSK.year, START_MSK.month - 1, START_MSK.day) - 3 * 3600e3; // МСК = UTC+3
const N = RIDDLES.length;
const STORE = 'ostanovki_v1';

const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
// загадки: только буквы и цифры
const normAnswer = s => norm(s).replace(/[^\p{L}\p{N}]/gu, '');
// финал: буквы, цифры и одиночные пробелы между словами
const normPhrase = s => norm(s.replace(/[^\p{L}\p{N}\s]/gu, ' '));

let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.solved) return s; } catch (e) {}
  return { solved: {}, hint2: {}, keyLevel: 0, finalSolved: false };
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

// Время берём с сервера (заголовок Date), чтобы перевод часов на телефоне ничего не открывал.
let timeOffset = 0;
const now = () => Date.now() + timeOffset;
function syncTime() {
  if (!/^https?:/.test(location.protocol)) return;
  fetch(location.pathname + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' }).then(r => {
    const d = Date.parse(r.headers.get('Date'));
    if (isNaN(d)) return;
    timeOffset = d - Date.now();
    if (!document.getElementById('map').classList.contains('hidden')) renderMap();
    else if (/^#\/day\/\d+$/.test(location.hash) && !isOpen(+location.hash.split('/')[2])) location.hash = '#/';
  }).catch(() => {});
}

const unlockAt = n => START_UTC + (n - 1) * DAY_MS;
const isOpen = n => now() >= unlockAt(n) || (!!DEV_KEY && n <= state.keyLevel);
const solvedCount = () => Object.keys(state.solved).length;
const allSolved = () => solvedCount() >= N;
const letterOf = n => RIDDLES[n - 1].answers[0][0].toUpperCase();
const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', timeZone: 'Europe/Moscow' });
function fmtLeft(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), sec = s % 60, p = x => String(x).padStart(2, '0');
  return (d ? d + 'д ' : '') + p(h) + ':' + p(m) + ':' + p(sec);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ICON = {
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor" fill-opacity=".18"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
};

/* ---------- декор: звёзды, луны, планеты ---------- */
function drawDoodles() {
  const W = innerWidth, H = innerHeight, box = document.getElementById('doodles');
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const shapes = {
    spark: '<path d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10z" fill="#fff"/>',
    star: '<path d="M0-8l2.4 5 5.4.6-4 3.7 1.1 5.4L0 4l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>',
    moon: '<path d="M4-13A13 13 0 1 0 6 12 10 10 0 1 1 4-13z" fill="none" stroke="#fff" stroke-width="2"/>',
    planet: '<circle r="11" fill="none" stroke="#fff" stroke-width="2"/><ellipse rx="22" ry="6" transform="rotate(-12)" fill="none" stroke="#fff" stroke-width="2"/>',
    dot: '<circle r="2.2" fill="#fff"/>',
  };
  const list = ['moon', 'planet', 'moon', 'planet', 'spark', 'spark', 'spark', 'spark', 'spark', 'star', 'star', 'star', 'star', 'dot', 'dot', 'dot', 'dot', 'dot', 'dot', 'dot'];
  box.innerHTML = list.map(k => {
    const x = rnd() * W, y = 60 + rnd() * (H - 80), sc = k === 'dot' ? 1 : .8 + rnd() * .6;
    const cls = (k === 'spark' || k === 'dot') ? 'twinkle' : '';
    return `<svg class="${cls}" style="left:${x}px;top:${y}px;opacity:${k === 'dot' ? .8 : .9};animation-delay:${(rnd() * 3).toFixed(2)}s" width="1" height="1"><g transform="scale(${sc.toFixed(2)})">${shapes[k]}</g></svg>`;
  }).join('');
}

/* ---------- карта ---------- */
const STEP = 112, TOP_PAD = 150, BOTTOM_PAD = 110;
let timerEl = null, timerDay = 0;

function renderMap() {
  const track = document.getElementById('track');
  const W = Math.min(innerWidth, 480);
  const showFinal = allSolved();
  const count = N + 1; // место под финальную всегда оставляем
  const H = TOP_PAD + (count - 1) * STEP + BOTTOM_PAD;
  track.style.height = H + 'px';
  const amp = W * 0.27;
  const pts = [];
  for (let i = 0; i < count; i++) {
    const x = i === N ? W / 2 : W / 2 + amp * Math.sin(i * 0.85);
    pts.push([x, H - BOTTOM_PAD - i * STEP]);
  }
  // путь
  const usePts = showFinal ? pts : pts.slice(0, N);
  let d = `M${usePts[0][0]},${usePts[0][1]}`;
  for (let i = 1; i < usePts.length; i++) {
    const [x0, y0] = usePts[i - 1], [x1, y1] = usePts[i], my = (y0 + y1) / 2;
    d += ` C${x0},${my} ${x1},${my} ${x1},${y1}`;
  }
  // пройденная часть
  let reached = 0; for (let n = 1; n <= N; n++) if (isOpen(n)) reached = n;
  const svg = document.getElementById('pathSvg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <path d="${d}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="16" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".95"/>`;

  track.querySelectorAll('.stop,.stop-date,.timer').forEach(e => e.remove());
  const nextLocked = (() => { for (let n = 1; n <= N; n++) if (!isOpen(n)) return n; return 0; })();

  for (let n = 1; n <= N; n++) {
    const [x, y] = pts[n - 1];
    const el = document.createElement('div');
    const open = isOpen(n), solved = !!state.solved[n];
    el.className = 'stop ' + (solved ? 'solved' : open ? 'open' : 'time-locked');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = (solved ? `<span class="letter">${letterOf(n)}</span>` : ICON.lock) + `<span class="num">${n}</span>`;
    el.onclick = () => {
      if (open) location.hash = '#/day/' + n;
      else toast('Откроется ' + fmtDate(unlockAt(n)) + ' в 00:00');
    };
    track.appendChild(el);

    if (n === nextLocked) {
      const t = document.createElement('button');
      t.className = 'timer'; t.style.left = x + 'px'; t.style.top = y + 'px';
      t.innerHTML = ICON.clock + '<span></span>';
      t.onclick = openKeyModal;
      track.appendChild(t);
      timerEl = t.querySelector('span'); timerDay = n; tick();
    } else if (!open) {
      const lb = document.createElement('div');
      lb.className = 'stop-date'; lb.style.left = x + 'px'; lb.style.top = y + 'px';
      lb.textContent = fmtDate(unlockAt(n));
      track.appendChild(lb);
    }
  }
  if (!nextLocked) timerEl = null;

  if (showFinal) {
    const [x, y] = pts[N];
    const el = document.createElement('div');
    el.className = 'stop final' + (state.finalSolved ? ' solved' : ' open');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = ICON.star;
    el.onclick = () => location.hash = '#/final';
    track.appendChild(el);
  }

  document.getElementById('progressLbl').textContent = `Собрано букв: ${solvedCount()} из ${N}`;
  centerGlyphs(track);
  return { pts, reached, H };
}

function tick() {
  if (!timerEl) return;
  const left = unlockAt(timerDay) - now();
  if (left <= 0) { if (!document.getElementById('map').classList.contains('hidden')) renderMap(); return; }
  timerEl.textContent = fmtLeft(left);
}
setInterval(tick, 1000);

/* ---------- модалки ---------- */
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}<button class="close">Закрыть</button></div>`;
  bg.onclick = e => { if (e.target === bg || e.target.classList.contains('close')) bg.remove(); };
  document.body.appendChild(bg);
  return bg;
}
function openKeyModal() {
  if (!DEV_KEY) { toast('Откроется ' + fmtDate(unlockAt(timerDay)) + ' в 00:00'); return; }
  const n = timerDay;
  const m = modal(`<h2>День ${n}</h2><p>Откроется ${fmtDate(unlockAt(n))} в 00:00 по Москве.<br>Или введи ключ доступа:</p>
    <form class="answer-row"><input placeholder="Ключ доступа" autocomplete="off"><button class="btn">Открыть</button></form>
    <div class="err"></div>`);
  const inp = m.querySelector('input'), err = m.querySelector('.err');
  setTimeout(() => inp.focus(), 50);
  m.querySelector('form').onsubmit = e => {
    e.preventDefault();
    if (norm(inp.value) === norm(DEV_KEY)) {
      state.keyLevel = Math.max(state.keyLevel, n); save(); m.remove();
      location.hash = '#/day/' + n;
    } else { err.textContent = 'Неверный ключ'; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); }
  };
}

// код прогресса: биты решённых дней + финал + уровень ключа, base36 + контрольный символ
function makeCode() {
  let v = 0;
  for (let n = 1; n <= N; n++) if (state.solved[n]) v += 2 ** (n - 1);
  if (state.finalSolved) v += 2 ** N;
  v += state.keyLevel * 2 ** (N + 1);
  const s = v.toString(36).toUpperCase();
  const sum = [...s].reduce((a, c) => a + parseInt(c, 36), 0) % 36;
  return s + sum.toString(36).toUpperCase();
}
function readCode(code) {
  code = code.replace(/[^0-9a-z]/gi, '').toUpperCase();
  if (code.length < 2) return null;
  const s = code.slice(0, -1), chk = code.slice(-1);
  if (([...s].reduce((a, c) => a + parseInt(c, 36), 0) % 36).toString(36).toUpperCase() !== chk) return null;
  let v = parseInt(s, 36); if (!isFinite(v)) return null;
  const st = { solved: {}, hint2: {}, keyLevel: 0, finalSolved: false };
  for (let n = 1; n <= N; n++) if (Math.floor(v / 2 ** (n - 1)) % 2) st.solved[n] = true;
  st.finalSolved = Math.floor(v / 2 ** N) % 2 === 1;
  st.keyLevel = Math.min(N, Math.floor(v / 2 ** (N + 1)));
  return st;
}
function openCodeModal() {
  const code = makeCode();
  const m = modal(`<h2>Код прогресса</h2>
    <p>Прогресс хранится в этом браузере. Чтобы продолжить на другом устройстве - сохрани этот код:</p>
    <div class="code-box">${code}</div>
    <button class="btn" id="copyBtn" style="width:100%">Скопировать</button>
    <div class="sep"></div>
    <p>Уже есть код с другого устройства?</p>
    <form class="answer-row"><input placeholder="Введи код" autocomplete="off"><button class="btn">Ок</button></form>
    <div class="err"></div>`);
  m.querySelector('#copyBtn').onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Код скопирован'), () => toast('Выдели код и скопируй вручную'));
  };
  const inp = m.querySelector('input'), err = m.querySelector('.err');
  m.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const st = readCode(inp.value);
    if (!st) { err.textContent = 'Код не подходит'; return; }
    state = st; save(); m.remove(); renderMap(); toast('Прогресс восстановлен');
  };
}
document.getElementById('menuBtn').onclick = openCodeModal;

let toastT;
function toast(text) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

/* ---------- экран остановки ---------- */
// места для крошечных надписей (меняются по дням)
const TINY_SPOTS = [
  'right:18px;top:calc(22px + env(safe-area-inset-top));color:#fff',
  'left:22px;top:118px;color:rgba(255,255,255,.95);transform:rotate(-8deg)',
  'copper',
  'right:26px;bottom:34px;color:#8a6a55;transform:rotate(6deg)',
  'left:24px;bottom:58px;color:#8a6a55;transform:rotate(-4deg)',
  'right:30px;top:150px;color:#fff;transform:rotate(10deg)',
  'pole',
];

// каждое слово - неразрывный блок; переносы только между словами
function bigWord(word) {
  const [first, ...rest] = word.toUpperCase().split(/\s+/);
  return [`<span class="w"><span class="first"><i>${esc(first[0])}</i></span>${esc(first.slice(1))}</span>`,
    ...rest.map(w => `<span class="w">${esc(w)}</span>`)].join(' ');
}
// точно центрирует букву в кружке по её реальному контуру (у шрифта буквы сидят неровно)
const glyphCtx = document.createElement('canvas').getContext('2d');
function centerGlyphs(root) {
  const run = () => root.querySelectorAll('.stop .letter, .first i').forEach(el => {
    const cs = getComputedStyle(el);
    glyphCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = glyphCtx.measureText(el.textContent);
    const dx = m.width / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
    const dy = -(m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 - (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
    el.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px)`;
  });
  run();
  if (document.fonts) document.fonts.ready.then(run);
}
// уменьшает шрифт, пока самое длинное слово не поместится в одну строку
function fitWord(el, maxSize) {
  if (!el) return;
  const fit = () => {
    let size = maxSize;
    el.style.fontSize = size + 'px';
    const words = [...el.querySelectorAll('.w')];
    while (size > 14 && words.some(w => w.offsetWidth > el.clientWidth)) el.style.fontSize = --size + 'px';
  };
  fit();
  if (document.fonts) document.fonts.ready.then(fit);
}

function renderDay(n) {
  const typed = document.getElementById('ans')?.value || ''; // не терять введённое при открытии подсказки
  const r = RIDDLES[n - 1], solved = !!state.solved[n];
  const spot = TINY_SPOTS[(n * 5) % TINY_SPOTS.length];
  const tiny = r.tiny ? esc(r.tiny) : '';
  const wrap = document.getElementById('dayWrap');
  wrap.innerHTML = `
    <button class="back" onclick="location.hash='#/'">${ICON.back}К маршруту</button>
    <div class="sign">
      <div class="sign-plate"><div class="sign-head">ОСТАНОВКА</div><div class="sign-body">День ${n}</div></div>
      <div class="sign-pole" style="position:relative">${spot === 'pole' && tiny ? `<span class="tiny" style="left:14px;top:4px;color:#fff;font-size:9px">${tiny}</span>` : ''}</div>
    </div>
    <div class="shelter">
      <div class="roof"></div>
      <div class="frame" id="frame"></div>
      <div class="copper"><div class="bench"></div>${spot === 'copper' && tiny ? `<span class="tiny" style="right:12px;bottom:6px;color:#f3c7a8;opacity:.5;font-size:9px">${tiny}</span>` : ''}</div>
      <div class="floor"></div>
    </div>
    ${spot !== 'pole' && spot !== 'copper' && tiny ? `<span class="tiny" style="${spot}">${tiny}</span>` : ''}`;
  const frame = document.getElementById('frame');

  if (solved) {
    frame.innerHTML = `<div class="solved-box"><div class="lbl">Ответ</div><div class="big-word">${bigWord(r.answers[0])}</div>
      <div class="lbl">Буква дня - ${letterOf(n)}</div></div>`;
    fitWord(frame.querySelector('.big-word'), 44);
    centerGlyphs(frame);
    return;
  }
  // подсказки открываются по очереди: №3 появляется только после открытия №2
  const hints = [r.hint2, r.hint3];
  let extra = '';
  for (let i = 0; i < hints.length; i++) {
    const num = i + 2, bag = 'hint' + num;
    if (!hints[i]) break;
    if ((state[bag] || {})[n]) extra += `<div class="card"><h3>Подсказка №${num}</h3><p>${esc(hints[i])}</p></div>`;
    else { extra += `<button class="hint2-btn" data-hint="${num}">Подсказка №${num}<span>нажми, чтобы открыть</span></button>`; break; }
  }
  frame.innerHTML = `
    <div class="card"><h3>Подсказка №1</h3><p>${esc(r.hint1)}</p></div>
    ${extra}
    <form class="answer-row" id="ansForm"><input id="ans" placeholder="Твой ответ" autocomplete="off" autocapitalize="off"><button class="btn">Проверить</button></form>
    <div class="wrong" id="wrong"></div>`;
  document.getElementById('ans').value = typed;
  const b = frame.querySelector('[data-hint]');
  if (b) b.onclick = () => { const bag = 'hint' + b.dataset.hint; (state[bag] = state[bag] || {})[n] = true; save(); renderDay(n); };
  document.getElementById('ansForm').onsubmit = e => {
    e.preventDefault();
    const inp = document.getElementById('ans'), val = norm(inp.value);
    if (!val) return;
    if (r.answers.some(a => normAnswer(a) === normAnswer(val))) {
      state.solved[n] = true; save(); renderDay(n);
    } else {
      const w = document.getElementById('wrong');
      w.textContent = 'Подумай ещё';
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    }
  };
}

function renderFinal() {
  const wrap = document.getElementById('dayWrap');
  wrap.innerHTML = `
    <button class="back" onclick="location.hash='#/'">${ICON.back}К маршруту</button>
    <div class="sign">
      <div class="sign-plate"><div class="sign-head">КОНЕЧНАЯ</div><div class="sign-body">Финал</div></div>
      <div class="sign-pole"></div>
    </div>
    <div class="shelter">
      <div class="roof"></div>
      <div class="frame" id="frame">
        <div class="card"><h3>${esc(FINAL.principleTitle)}</h3><p>${esc(FINAL.principle)}</p></div>
        <div id="finalZone"></div>
      </div>
      <div class="copper"><div class="bench"></div></div>
      <div class="floor"></div>
    </div>`;
  const zone = document.getElementById('finalZone');
  const showRule = () => {
    const words = FINAL.answers[0].toUpperCase().split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join(' ');
    zone.innerHTML = `<div class="solved-box" style="padding:10px 0 14px"><div class="big-word">${words}</div></div>
      <div class="card rule"><h3>${esc(FINAL.ruleTitle)}</h3><p>${esc(FINAL.rule)}</p></div>`;
    fitWord(zone.querySelector('.big-word'), 30);
  };
  if (state.finalSolved) return showRule();
  zone.innerHTML = `<form class="answer-row" id="ansForm"><input id="ans" placeholder="Фраза из букв" autocomplete="off" autocapitalize="off"><button class="btn">Проверить</button></form>
    <div class="wrong" id="wrong"></div>`;
  document.getElementById('ansForm').onsubmit = e => {
    e.preventDefault();
    const inp = document.getElementById('ans'), val = normPhrase(inp.value);
    if (!val) return;
    if (FINAL.answers.some(a => normPhrase(a) === val)) { state.finalSolved = true; save(); showRule(); }
    else {
      document.getElementById('wrong').textContent = 'Подумай ещё';
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    }
  };
}

/* ---------- навигация ---------- */
let firstMapShow = true;
function route() {
  const h = location.hash, map = document.getElementById('map'), day = document.getElementById('day');
  const m = h.match(/^#\/day\/(\d+)$/);
  if (m && +m[1] >= 1 && +m[1] <= N && isOpen(+m[1])) {
    map.classList.add('hidden'); day.classList.remove('hidden', 'final-mode');
    renderDay(+m[1]); scrollTo(0, 0); return;
  }
  if (h === '#/final' && allSolved()) {
    map.classList.add('hidden'); day.classList.remove('hidden'); day.classList.add('final-mode');
    renderFinal(); scrollTo(0, 0); return;
  }
  day.classList.add('hidden'); map.classList.remove('hidden');
  const { pts, reached, H } = renderMap();
  // прокрутить к текущей остановке
  const target = allSolved() ? pts[N] : pts[Math.max(0, reached - 1)];
  if (firstMapShow || !lastMapScroll) scrollTo(0, Math.max(0, target[1] - innerHeight * 0.55));
  else scrollTo(0, lastMapScroll);
  firstMapShow = false;
}
let lastMapScroll = 0;
addEventListener('scroll', () => { if (!document.getElementById('map').classList.contains('hidden')) lastMapScroll = scrollY; });
addEventListener('hashchange', route);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawDoodles(); if (!document.getElementById('map').classList.contains('hidden')) renderMap(); }, 150); });

drawDoodles();
route();
syncTime();
</script>
